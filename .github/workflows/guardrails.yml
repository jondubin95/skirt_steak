name: Guardrails

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  branch-and-secrets:
    name: Branch naming and Sensitive/ check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          echo "Head branch: $HEAD_REF"
          # Allowed working branches (see AGENTS.md):
          # - feature/[a-z0-9-]{3,40}  (local / human)
          # - cursor/<name>-<id>       (Cursor Cloud Agents; id is run-assigned)
          if [[ "$HEAD_REF" =~ ^feature/[a-z0-9-]{3,40}$ ]] || [[ "$HEAD_REF" =~ ^cursor/[a-z0-9-]+-[a-z0-9]+$ ]]; then
            echo "Branch name OK."
          else
            echo "::error::Branch '$HEAD_REF' does not match feature/[a-z0-9-]{3,40} or cursor/<name>-<id>. See AGENTS.md."
            exit 1
          fi

      - name: Block Sensitive/ files in this PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'Sensitive/' || true)"
          blocked="$(printf '%s\n' "$changed" | grep -Ev '^$|^Sensitive/README\.md$' || true)"
          if [ -n "$blocked" ]; then
            echo "::error::PR touches files under Sensitive/ other than the tracked scaffold README:"
            echo "$blocked"
            exit 1
          fi
          echo "No secret files under Sensitive/ in this PR."

      - name: Verify PR body is not the raw template
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if echo "$PR_BODY" | grep -q "What changed?" || echo "$PR_BODY" | grep -q "Why was this needed?"; then
            echo "::error::PR body still contains raw template placeholders. Replace them with repo-specific content (see .github/pull_request_template.md and docs/workflow-guardrails.md)."
            exit 1
          fi
          echo "PR body does not contain raw template placeholders."

  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: python -m pip install --upgrade pip black pylint

      - name: Syntax check (blocking)
        run: |
          set -euo pipefail
          find python -name '*.py' -print0 | xargs -0 -n1 python -m py_compile

      - name: Board secretary unit tests (blocking)
        run: python -m unittest discover -s python/msjc_board_secretary/tests -p "test_*.py"

      - name: black --check (advisory, does not fail the build)
        run: |
          python -m black --check python || \
            echo "::warning::black would reformat some files. Existing code predates formatting enforcement; run 'black python' locally to fix."

      - name: pylint (advisory, does not fail the build)
        run: |
          find python -maxdepth 1 -name '*.py' -print0 | xargs -0 -r python -m pylint --exit-zero
